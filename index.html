<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ZenSports — Software de gestión deportiva con cobro automático por WhatsApp, inscripciones digitales y control de asistencia para clubs en Colombia y Latam." />
    <meta name="keywords" content="software deportivo, gestión de club, cobro WhatsApp, inscripciones deportivas, club de fútbol Colombia, ZenSports" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://zensports.zenpra.ai" />

    <!-- Open Graph -->
    <meta property="og:title" content="ZenSports — El OS para tu club deportivo" />
    <meta property="og:description" content="Cobro automático por WhatsApp, inscripciones digitales y control total de tu club. Prueba 5 días gratis, sin tarjeta." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://zensports.zenpra.ai" />
    <meta property="og:image" content="https://zensports.zenpra.ai/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:site_name" content="ZenSports" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ZenSports — El OS para tu club deportivo" />
    <meta name="twitter:description" content="Cobro automático por WhatsApp, inscripciones digitales y control total de tu club. Prueba 5 días gratis, sin tarjeta." />
    <meta name="twitter:image" content="https://zensports.zenpra.ai/og-image.jpg" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "ZenSports",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "url": "https://zensports.zenpra.ai",
      "description": "Software de gestión deportiva con cobro automático por WhatsApp, inscripciones digitales y control de asistencia para clubs en Colombia y Latam.",
      "offers": [
        {
          "@type": "Offer",
          "name": "Starter",
          "price": "149000",
          "priceCurrency": "COP",
          "description": "Hasta 120 jugadores. Jugadores + uniformes + cobro automático."
        },
        {
          "@type": "Offer",
          "name": "Pro",
          "price": "399000",
          "priceCurrency": "COP",
          "description": "Hasta 350 jugadores. + torneos + arbitraje + WhatsApp."
        },
        {
          "@type": "Offer",
          "name": "Scale",
          "price": "799000",
          "priceCurrency": "COP",
          "description": "Hasta 1.000 jugadores. + conciliación + finanzas avanzadas."
        }
      ],
      "provider": {
        "@type": "Organization",
        "name": "Zenpra",
        "url": "https://zensports.zenpra.ai",
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "sales",
          "availableLanguage": "Spanish"
        }
      }
    }
    </script>

    <title>ZenSports — Gestión deportiva con cobro automático por WhatsApp</title>

    <!-- Preload hero image (LCP candidate) -->
    <link rel="preload" as="image" href="/og-image.jpg" fetchpriority="high" />

    <!-- Sport Event: display/headings -->
    <style>
      @font-face {
        font-family: 'Sport Event';
        src: url('/fonts/sportevent-display.otf') format('opentype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Sport Event';
        src: url('/fonts/sportevent-italic.otf') format('opentype');
        font-weight: 400;
        font-style: italic;
        font-display: swap;
      }
    </style>

    <!-- Fuentes — non-blocking (media print trick) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Space Grotesk: cuerpo de texto -->
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap">
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
